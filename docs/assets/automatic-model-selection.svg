<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Automatic model selection</title>
  <desc id="desc">A Codex task is evaluated by scope, ambiguity, coupling, verification, and latency, then routed to the lowest sufficient GPT-5.6 model and reasoning effort.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172236"/><stop offset="1" stop-color="#0c1320"/></linearGradient>
    <linearGradient id="router" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#243a50"/><stop offset="1" stop-color="#1a293d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7890a6"/></marker>
  </defs>
  <rect width="1200" height="470" rx="28" fill="url(#bg)"/>
  <circle cx="1120" cy="20" r="170" fill="#244b60" opacity=".42"/>
  <text x="54" y="62" fill="#9db5c2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="700" letter-spacing="3">AUTOMATIC MODEL SELECTION</text>
  <text x="54" y="105" fill="#f3f6f9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="30" font-weight="750">Every task gets the lowest sufficient route</text>

  <g filter="url(#shadow)">
    <rect x="54" y="158" width="220" height="176" rx="22" fill="#202d40" stroke="#42556a"/>
    <text x="82" y="197" fill="#92a8b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="700">CODEX TASK</text>
    <text x="82" y="241" fill="#f3f6f9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="25" font-weight="750">Fix, build,</text>
    <text x="82" y="273" fill="#f3f6f9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="25" font-weight="750">review, migrate...</text>
    <rect x="82" y="296" width="126" height="22" rx="11" fill="#2d3b50"/>
    <text x="94" y="312" fill="#b8c7d2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">re-evaluated each time</text>

    <rect x="360" y="142" width="330" height="208" rx="26" fill="url(#router)" stroke="#57708a"/>
    <text x="392" y="184" fill="#b9efd3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19" font-weight="800">ROUTER</text>
    <text x="392" y="220" fill="#f3f6f9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="25" font-weight="760">Reads the work, not</text>
    <text x="392" y="251" fill="#f3f6f9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="25" font-weight="760">the previous route</text>
    <g fill="#a9bac7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">
      <text x="392" y="292">scope</text><text x="470" y="292">ambiguity</text><text x="572" y="292">coupling</text>
      <text x="392" y="320">verification</text><text x="500" y="320">risk</text><text x="552" y="320">latency</text>
    </g>
  </g>

  <path d="M274 246 H346" stroke="#7890a6" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M690 246 H744" stroke="#7890a6" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="760" y="137" width="386" height="82" rx="20" fill="#183a37" stroke="#5aa98c"/>
    <text x="786" y="170" fill="#b9efd3" font-size="23" font-weight="800">LUNA</text>
    <text x="874" y="170" fill="#eef7f3" font-size="16" font-weight="650">medium · high · max</text>
    <text x="786" y="197" fill="#9fc7b8" font-size="14">mechanical → ordinary → deep deterministic</text>

    <rect x="760" y="235" width="386" height="72" rx="20" fill="#3b3323" stroke="#b99a52"/>
    <text x="786" y="269" fill="#e6d18f" font-size="23" font-weight="800">TERRA</text>
    <text x="888" y="269" fill="#f7f1df" font-size="16" font-weight="650">high</text>
    <text x="786" y="292" fill="#c9b98c" font-size="14">latency-sensitive work</text>

    <rect x="760" y="323" width="386" height="82" rx="20" fill="#1f3048" stroke="#527aaa"/>
    <text x="786" y="356" fill="#b9d7ff" font-size="23" font-weight="800">SOL</text>
    <text x="851" y="356" fill="#edf4ff" font-size="16" font-weight="650">medium · high · xhigh</text>
    <text x="786" y="383" fill="#a8bed9" font-size="14">complex → high ambiguity → failed complex attempt</text>
  </g>

  <text x="54" y="425" fill="#8fa5b6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15">Task evidence and explicit user overrides always win.</text>
</svg>
