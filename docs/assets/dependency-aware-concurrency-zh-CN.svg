<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">依赖感知并发</title>
  <desc id="desc">路由器识别独立任务，安全并行执行，无冲突地串行共享资源，并汇总已验证结果。</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172236"/><stop offset="1" stop-color="#0c1320"/></linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7890a6"/></marker>
  </defs>
  <rect width="1200" height="470" rx="28" fill="url(#bg2)"/>
  <circle cx="60" cy="470" r="180" fill="#244b60" opacity=".42"/>
  <text x="54" y="62" fill="#9db5c2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif" font-size="18" font-weight="700" letter-spacing="3">依赖感知并发</text>
  <text x="54" y="105" fill="#f3f6f9" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif" font-size="30" font-weight="750">只有真正独立的任务才并行</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif" filter="url(#shadow2)">
    <rect x="54" y="170" width="196" height="134" rx="22" fill="#202d40" stroke="#42556a"/>
    <text x="80" y="207" fill="#92a8b8" font-size="15" font-weight="700">协调器</text>
    <text x="80" y="244" fill="#f3f6f9" font-size="20" font-weight="760">构建任务依赖图</text>
    <text x="80" y="274" fill="#a9bac7" font-size="14">依赖 · 写入范围</text>

    <rect x="366" y="139" width="236" height="72" rx="18" fill="#183a37" stroke="#5aa98c"/>
    <text x="390" y="171" fill="#b9efd3" font-size="18" font-weight="800">任务 A · 读取</text>
    <text x="390" y="193" fill="#a9c8bc" font-size="13">仓库分析</text>

    <rect x="366" y="230" width="236" height="72" rx="18" fill="#1f3048" stroke="#527aaa"/>
    <text x="390" y="262" fill="#b9d7ff" font-size="18" font-weight="800">任务 B · 写入</text>
    <text x="390" y="284" fill="#a8bed9" font-size="13">仅写入负责文件</text>

    <rect x="366" y="321" width="236" height="72" rx="18" fill="#3b3323" stroke="#b99a52"/>
    <text x="390" y="353" fill="#e6d18f" font-size="18" font-weight="800">任务 C · 验证</text>
    <text x="390" y="375" fill="#c9b98c" font-size="12">等待必要依赖</text>

    <rect x="694" y="145" width="220" height="108" rx="21" fill="#243247" stroke="#4c6179"/>
    <text x="720" y="180" fill="#f3f6f9" font-size="19" font-weight="760">完成即补位</text>
    <text x="720" y="207" fill="#9fb2c1" font-size="14">关键路径优先</text>
    <text x="720" y="229" fill="#9fb2c1" font-size="14">空闲槽位立即补位</text>

    <rect x="694" y="285" width="220" height="108" rx="21" fill="#3a2c2c" stroke="#9a6666"/>
    <text x="720" y="320" fill="#f0c0bc" font-size="19" font-weight="760">发生冲突？</text>
    <text x="720" y="347" fill="#cda8a5" font-size="14">共享文件或资源</text>
    <text x="720" y="369" fill="#cda8a5" font-size="14">→ 安全串行</text>

    <rect x="1000" y="194" width="146" height="150" rx="22" fill="#1c3a35" stroke="#5aa98c"/>
    <text x="1026" y="232" fill="#b9efd3" font-size="17" font-weight="800">结果</text>
    <text x="1026" y="266" fill="#f3f6f9" font-size="18" font-weight="720">汇总</text>
    <text x="1026" y="292" fill="#f3f6f9" font-size="18" font-weight="720">已验证</text>
    <text x="1026" y="318" fill="#f3f6f9" font-size="18" font-weight="720">结果</text>
  </g>

  <g fill="none" stroke="#7890a6" stroke-width="3" marker-end="url(#arrow2)">
    <path d="M250 223 C300 223 310 175 352 175"/>
    <path d="M250 237 H352"/>
    <path d="M250 251 C300 251 310 357 352 357"/>
    <path d="M602 175 H680"/>
    <path d="M602 266 C640 266 648 199 680 199"/>
    <path d="M602 357 H680"/>
    <path d="M914 199 C950 199 958 240 986 240"/>
    <path d="M914 339 C956 339 958 300 986 300"/>
  </g>

  <text x="54" y="430" fill="#8fa5b6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif" font-size="14">最多 4 个任务（含协调器）· 写入范围不重叠 · 不预建等待队列</text>
</svg>
